            <section id="note-01-exam" class="wiki-section">
              <h4>7. 시험 직전 체크</h4>
              <div class="wiki-callout exam"><strong>반드시 구분할 것</strong><ul><li>대장 점막에는 plicae와 villi가 없다.</li><li>대장 장샘은 길고 곧은 simple tubular gland이다.</li><li>Teniae coli는 바깥세로근층의 변형이다.</li><li>Haustra는 결장벽의 sacculation, appendices epiploicae는 장막 표면의 지방주머니이다.</li><li>충수의 가장 강한 조직학적 단서는 풍부한 림프소절이다.</li><li>속항문조임근은 평활근·불수의근, 바깥항문조임근은 골격근·수의근이다.</li><li>직장항문경계에서 단층원주상피가 비각질중층편평상피로 전환된다.</li></ul></div>
              <p>현재 정리본은 제공된 6페이지 PDF의 <strong>대장 파트</strong>만 반영한다. 같은 1강의 구강, 식도, 위, 소장 파트 자료가 추가되면 이 문서의 앞부분에 이어서 통합할 수 있다.</p>
            </section>
          </div>
        </div>
      </article>`
    };
    const lectureNoteSources = window.LECTURE_NOTE_SOURCES || {};
    let noteEditingCourseId = null;

    const normalizeWikiKey = value => String(value || '')
      .replace(/'''|''/g, '')
      .trim()
      .toLocaleLowerCase('ko')
      .replace(/[^\p{L}\p{N}]+/gu, '-')
      .replace(/^-+|-+$/g, '');

    const wikiEmphasisMarkup = value => {
      const source = String(value ?? '');
      const emphasisPattern = /'''([^']+?)'''|''([^']+?)''/g;
      let output = '';
      let cursor = 0;
      for (const match of source.matchAll(emphasisPattern)) {
        output += escapeHtml(source.slice(cursor, match.index));
        output += match[1] != null
          ? `<strong>${escapeHtml(match[1])}</strong>`
          : `<em>${escapeHtml(match[2])}</em>`;
        cursor = match.index + match[0].length;
      }
      output += escapeHtml(source.slice(cursor));
      return output;
    };

    function findWikiCourse(documentName, currentCourse) {
      const wanted = String(documentName || '').trim();
      if (!wanted) return currentCourse;
      const normalized = wanted.replace(/\s+/g, '').toLocaleLowerCase('ko');
      return courses.find(course => {
        const candidates = [
          titleText(course, false),
          titleText(course),
          `${course.id}강`,
          `${course.id} ${titleText(course, false)}`
        ];
        return candidates.some(candidate => candidate.replace(/\s+/g, '').toLocaleLowerCase('ko') === normalized);
      });
    }

    function wikiLinkMarkup(rawTarget, rawDisplay, currentCourse) {
      const target = String(rawTarget || '').trim();
      const separator = target.indexOf('#');
      const documentName = separator >= 0 ? target.slice(0, separator).trim() : target;
      const sectionName = separator >= 0 ? target.slice(separator + 1).trim() : '';
      const display = String(rawDisplay || '').trim() || (documentName || `#${sectionName}`);
      const targetCourse = findWikiCourse(documentName, currentCourse);
      if (!targetCourse) return `<span class="wiki-link-missing" title="연결할 문서를 찾을 수 없습니다.">${wikiEmphasisMarkup(display)}</span>`;
      return `<a class="wiki-link" href="#lecture-${targetCourse.id}" data-wiki-course="${targetCourse.id}" data-wiki-section="${escapeHtml(sectionName)}">${wikiEmphasisMarkup(display)}</a>`;
    }

    function wikiFootnotePreviewText(value) {
      const text = String(value || '')
        .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/\{\{(\d+)\}\}/g, '$1번 문항')
        .replace(/'''|''/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > 260 ? `${text.slice(0, 257)}…` : text;
    }

    function renderWikiInline(value, course, footnoteState, allowFootnotes = true) {
      const source = String(value || '');
      const tokenPattern = /\[\*([^\]]+)\]|\[\[([^\]]+)\]\]|\{\{(\d+)\}\}/g;
      let output = '';
      let cursor = 0;
      for (const match of source.matchAll(tokenPattern)) {
        output += wikiEmphasisMarkup(source.slice(cursor, match.index));
        if (match[1] != null && allowFootnotes) {
          const rawBody = match[1];
          const anonymous = /^\s/.test(rawBody);
          const trimmed = rawBody.trim();
          let name = '';
          let content = trimmed;
          if (!anonymous) {
            const namedMatch = trimmed.match(/^(\S+)\s+([\s\S]+)$/);
            if (namedMatch) {
              [, name, content] = namedMatch;
            } else {
              name = trimmed;
              const existing = footnoteState.named.get(name);
              content = existing ? existing.content : '각주 내용 없음';
            }
          }
          let footnote = name ? footnoteState.named.get(name) : null;
          if (!footnote) {
            footnote = { number:footnoteState.items.length + 1, name, content, references:0 };
            footnoteState.items.push(footnote);
            if (name) footnoteState.named.set(name, footnote);
          }
          footnote.references += 1;
          const referenceId = `wiki-fnref-${course.id}-${footnote.number}-${footnote.references}`;
          output += `<sup><a id="${referenceId}" class="wiki-footnote-ref" href="#wiki-fn-${course.id}-${footnote.number}" data-wiki-footnote="${footnote.number}" data-wiki-footnote-preview="${escapeHtml(wikiFootnotePreviewText(footnote.content))}">[${footnote.number}]</a></sup>`;
        } else if (match[1] != null) {
          output += wikiEmphasisMarkup(match[0]);
        } else if (match[2] != null) {
          const parts = match[2].split('|');
          output += wikiLinkMarkup(parts.shift(), parts.join('|'), course);
        } else {
          const globalNumber = Number(match[3]);
          const linkedQuestion = jblQuestions.find(question => question.globalNumber === globalNumber);
          output += linkedQuestion
            ? `<a class="jbl-question-link" href="#jbl-q-${globalNumber}" data-jbl-question-link="${globalNumber}">${globalNumber}번 문항</a>`
            : `<span class="jbl-question-link-missing" title="연결할 문항을 찾을 수 없습니다.">${globalNumber}번 문항</span>`;
        }
        cursor = match.index + match[0].length;
      }
      output += wikiEmphasisMarkup(source.slice(cursor));
      return output;
    }

    function renderWikiFigure(line, course, footnoteState) {
      const match = line.match(/^\[\[파일:([^|\]]+)(?:\|([^\]]*))?\]\]$/);
      if (!match) return '';
      const source = match[1].trim().replace(/^\.\//, '');
      const caption = (match[2] || '강의록 이미지').trim();
      if (!source || /^(?:javascript|data):/i.test(source)) return '<div class="wiki-render-warning">허용되지 않는 이미지 경로입니다.</div>';
      return `<figure class="wiki-figure"><img data-note-image src="./${escapeHtml(source)}" alt="${escapeHtml(caption)}" /><figcaption>${renderWikiInline(caption, course, footnoteState)}</figcaption></figure>`;
    }

    function renderWikiDocument(source, course) {
      const lines = String(source || '').replace(/\r\n?/g, '\n').split('\n');
      const footnotes = { items:[], named:new Map() };
      let title = titleText(course);
      let summary = '';
      const tags = [];
      const contentLines = [];
      lines.forEach(line => {
        const titleMatch = line.match(/^=\s+(.+?)\s+=$/);
        if (titleMatch) title = titleMatch[1];
        else if (line.startsWith('@summary ')) summary = line.slice(9).trim();
        else if (line.startsWith('@tag ')) tags.push(line.slice(5).trim());
        else contentLines.push(line);
      });

      const sectionHeadings = contentLines
        .map(line => line.match(/^==\s+(.+?)\s+==$/)?.[1])
        .filter(Boolean);
      const usedSlugs = new Map();
      const headingRecords = sectionHeadings.map((heading, index) => {
        const base = normalizeWikiKey(heading) || `section-${index + 1}`;
        const count = (usedSlugs.get(base) || 0) + 1;
        usedSlugs.set(base, count);
        return { heading, slug:count === 1 ? base : `${base}-${count}`, number:`s-${index + 1}` };
      });

      let sectionCursor = 0;
      let sectionOpen = false;
      let listOpen = false;
      let paragraph = [];
      const body = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        body.push(`<p>${renderWikiInline(paragraph.join(' '), course, footnotes)}</p>`);
        paragraph = [];
      };
      const closeList = () => {
        if (!listOpen) return;
        body.push('</ul>');
        listOpen = false;
      };
      const flushText = () => { flushParagraph(); closeList(); };

      for (let index = 0; index < contentLines.length; index += 1) {
        const line = contentLines[index].trim();
        if (!line) { flushText(); continue; }
        const sectionMatch = line.match(/^==\s+(.+?)\s+==$/);
        const subsectionMatch = line.match(/^===\s+(.+?)\s+===$/);
        const minorMatch = line.match(/^====\s+(.+?)\s+====$/);
        const imageMatch = line.match(/^\[\[파일:/);
        if (sectionMatch) {
          flushText();
          if (sectionOpen) body.push('</section>');
          const record = headingRecords[sectionCursor++] || { slug:`section-${sectionCursor}`, number:`s-${sectionCursor}` };
          body.push(`<section id="wiki-${course.id}-${record.slug}" class="wiki-section" data-wiki-section="${record.slug}" data-wiki-heading="${escapeHtml(record.heading)}" data-wiki-number="${record.number}"><h4>${renderWikiInline(sectionMatch[1], course, footnotes)}</h4>`);
          sectionOpen = true;
        } else if (subsectionMatch || minorMatch) {
          flushText();
          const heading = subsectionMatch?.[1] || minorMatch?.[1];
          body.push(`<h5 data-wiki-section="${normalizeWikiKey(heading)}">${renderWikiInline(heading, course, footnotes)}</h5>`);
        } else if (line.startsWith('* ')) {
          flushParagraph();
          if (!listOpen) { body.push('<ul>'); listOpen = true; }
          body.push(`<li>${renderWikiInline(line.slice(2), course, footnotes)}</li>`);
        } else if (line.startsWith('> ')) {
          flushText();
          body.push(`<div class="wiki-callout">${renderWikiInline(line.slice(2), course, footnotes)}</div>`);
        } else if (imageMatch) {
          flushText();
          const figures = [];
          while (index < contentLines.length && contentLines[index].trim().match(/^\[\[파일:/)) {
            figures.push(renderWikiFigure(contentLines[index].trim(), course, footnotes));
            index += 1;
          }
          index -= 1;
          body.push(`<div class="wiki-grid ${figures.length === 1 ? 'single' : ''}">${figures.join('')}</div>`);
        } else {
          paragraph.push(line);
        }
      }
      flushText();
      if (sectionOpen) body.push('</section>');

      if (footnotes.items.length) {
        body.push(`<section class="wiki-footnotes"><h4>각주</h4><ol>${footnotes.items.map(item => `<li id="wiki-fn-${course.id}-${item.number}" class="wiki-footnote-item" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="1" tabindex="0" role="link" aria-label="각주 ${item.number}의 본문 위치로 이동">${renderWikiInline(item.content, course, footnotes, false)}<span class="wiki-footnote-backs">${Array.from({ length:item.references }, (_, index) => `<a class="wiki-footnote-back" href="#wiki-fnref-${course.id}-${item.number}-${index + 1}" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="${index + 1}" aria-label="본문의 각주 ${item.number} ${index + 1}번째 위치로 돌아가기">↩${item.references > 1 ? index + 1 : ''}</a>`).join('')}</span></li>`).join('')}</ol></section>`);
      }

      const toc = headingRecords.map((record, index) => `<button class="wiki-toc-link" type="button" data-wiki-target="${record.slug}">${index + 1}. ${renderWikiInline(record.heading, course, footnotes, false)}</button>`).join('');
      const tagMarkup = tags.map(tag => `<span class="wiki-stat">${escapeHtml(tag)}</span>`).join('');
      return `<article class="wiki-note"><header class="wiki-hero"><div class="wiki-hero-title-row"><div class="wiki-hero-title"><h3>${renderWikiInline(title, course, footnotes, false)}</h3></div><button class="jbl-btn jbl-btn-sub wiki-hero-edit" type="button" data-wiki-edit>문서 편집</button></div>${summary ? `<p>${renderWikiInline(summary, course, footnotes, false)}</p>` : ''}<div class="wiki-stat-row">${tagMarkup}</div></header><div class="wiki-layout"><aside class="wiki-toc" aria-label="정리본 목차"><strong>목차</strong>${toc}</aside><div class="wiki-article">${body.join('')}</div></div></article>`;
    }

    function renderJblWikiFragment(value, question) {
      const course = byId(question.lectureIds?.[0]) || courses[0];
      const footnotes = { items:[], named:new Map() };
      const lines = String(value || '').replace(/\r\n?/g, '\n').split('\n');
      const output = [];
      let paragraph = [];
      let list = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        output.push(`<p>${paragraph.map(line => renderWikiInline(line, course, footnotes)).join('<br>')}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!list.length) return;
        output.push(`<ul>${list.map(item => `<li>${renderWikiInline(item, course, footnotes)}</li>`).join('')}</ul>`);
        list = [];
      };
      const flushText = () => { flushParagraph(); flushList(); };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) { flushText(); continue; }
        const levelTwo = line.match(/^==\s+(.+?)\s+==$/);
        const levelThree = line.match(/^===\s+(.+?)\s+===$/);
        if (levelTwo) { flushText(); output.push(`<h3>${renderWikiInline(levelTwo[1], course, footnotes, false)}</h3>`); continue; }
        if (levelThree) { flushText(); output.push(`<h4>${renderWikiInline(levelThree[1], course, footnotes, false)}</h4>`); continue; }
        if (line.startsWith('* ')) { flushParagraph(); list.push(line.slice(2)); continue; }
        if (line.startsWith('> ')) { flushText(); output.push(`<blockquote>${renderWikiInline(line.slice(2), course, footnotes)}</blockquote>`); continue; }
        flushList();
        paragraph.push(line);
      }
      flushText();

      if (footnotes.items.length) {
        output.push(`<section class="wiki-footnotes"><h4>각주</h4><ol>${footnotes.items.map(item => `<li id="wiki-fn-${course.id}-${item.number}" class="wiki-footnote-item" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="1" tabindex="0" role="link" aria-label="각주 ${item.number}의 본문 위치로 이동">${renderWikiInline(item.content, course, footnotes, false)}<span class="wiki-footnote-backs">${Array.from({ length:item.references }, (_, index) => `<a class="wiki-footnote-back" href="#wiki-fnref-${course.id}-${item.number}-${index + 1}" data-wiki-footnote-back="${item.number}" data-wiki-footnote-reference="${index + 1}" aria-label="본문의 각주 ${item.number} ${index + 1}번째 위치로 돌아가기">↩${item.references > 1 ? index + 1 : ''}</a>`).join('')}</span></li>`).join('')}</ol></section>`);
      }
      return `<div class="jbl-wiki-text">${output.join('')}</div>`;
    }

    function scrollToWikiSection(container, rawSection) {
      const requested = String(rawSection || '').replace(/^#/, '').trim();
      if (!requested) { container.querySelector('.wiki-note')?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
      const normalized = normalizeWikiKey(requested);
      const target = [...container.querySelectorAll('[data-wiki-section], [data-wiki-number]')].find(element =>
        element.dataset.wikiNumber === requested ||
        element.dataset.wikiSection === normalized ||
        normalizeWikiKey(element.dataset.wikiHeading) === normalized ||
        normalizeWikiKey(element.dataset.wikiHeading).endsWith(normalized)
      );
      target?.scrollIntoView({ behavior:'smooth', block:'start' });
    }

    function bindWikiDocument(container, course) {
      container.querySelectorAll('[data-wiki-target]').forEach(button => button.addEventListener('click', () => scrollToWikiSection(container, button.dataset.wikiTarget)));
      container.querySelectorAll('[data-jbl-question-link]').forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        openJblQuestionNumber(Number(link.dataset.jblQuestionLink));
      }));
      container.querySelectorAll('[data-wiki-course]').forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        const targetCourseId = Number(link.dataset.wikiCourse);
        const section = link.dataset.wikiSection;
        const fromJblCard = Boolean(container.closest('.jbl-card') || container.querySelector('.jbl-card'));
        if (targetCourseId === course.id && !fromJblCard) { scrollToWikiSection(container, section); return; }
        history.pushState({ detailTab:'정리본' }, '', `#lecture-${targetCourseId}`);
        showDetail(targetCourseId, fromJblCard ? 'jbl' : 'detail', '정리본');
        requestAnimationFrame(() => requestAnimationFrame(() => scrollToWikiSection(document.querySelector('#content-panel'), section)));
      }));
      const flashWikiTarget = target => {
        if (!target) return;
        target.scrollIntoView({ behavior:'smooth', block:'center' });
        target.classList.remove('wiki-footnote-flash');
        requestAnimationFrame(() => target.classList.add('wiki-footnote-flash'));
        window.setTimeout(() => target.classList.remove('wiki-footnote-flash'), 1200);
      };
      container.querySelectorAll('[data-wiki-footnote]').forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        flashWikiTarget(container.querySelector(`#wiki-fn-${course.id}-${link.dataset.wikiFootnote}`));
      }));
      container.querySelectorAll('[data-wiki-footnote-back]').forEach(element => {
        const returnToReference = event => {
          if (event.type === 'keydown' && !['Enter', ' '].includes(event.key)) return;
          if (event.currentTarget.classList.contains('wiki-footnote-item') && event.target !== event.currentTarget) return;
          event.preventDefault();
          event.stopPropagation();
          const reference = element.dataset.wikiFootnoteReference || '1';
          flashWikiTarget(container.querySelector(`#wiki-fnref-${course.id}-${element.dataset.wikiFootnote}-${reference}`));
        };
        element.addEventListener('click', returnToReference);
        if (element.classList.contains('wiki-footnote-item')) element.addEventListener('keydown', returnToReference);
      });
      container.querySelectorAll('[data-note-image]').forEach(image => {
        image.addEventListener('click', () => openJblImage(image.src));
        image.addEventListener('error', () => { image.closest('.wiki-figure').hidden = true; });
      });
    }

    function wikiSyntaxHelpMarkup() {
      const rows = [
        ['= 문서 제목 =', '문서 제목'], ['== 문단 제목 ==', '목차에 표시되는 상위 문단'], ['=== 하위 제목 ===', '문단 내부의 하위 제목'],
        ["'''굵은 글자'''", '굵게 표시'], ['* 목록', '글머리표 목록'], ['> 강조 문장', '강조 상자'],
        ['[[문서]]', '해당 강의 문서로 이동'], ['[[문서|출력글자]]', '표시 문구를 다르게 지정'],
        ['[[#문단]]', '현재 문서의 특정 문단으로 이동'], ['[[#문단|출력글자]]', '현재 문서 문단 링크의 표시 문구 지정'],
        ['[[다른 문서#문단|출력글자]]', '다른 강의 문서의 특정 문단으로 이동'],
        ['[* 각주 내용]', '자동 번호 각주'], ['[*이름 각주 내용]', '이름 있는 각주 생성'], ['[*이름]', '같은 이름의 기존 각주 재호출'],
        ['{{123}}', '고유 문항번호 123번 J로 이동'],
        ['[[파일:assets/경로/사진.jpg|사진 설명]]', '사진과 캡션 삽입']
      ];
      return `<details class="wiki-syntax-help"><summary>편집 문법 보기</summary><div class="wiki-syntax-grid">${rows.map(([syntax, description]) => `<code>${escapeHtml(syntax)}</code><span>${escapeHtml(description)}</span>`).join('')}</div></details>`;
    }

    function renderLectureNote(course, target) {
      const source = lectureNoteSources[course.id];
      if (!source) return false;
      if (noteEditingCourseId === course.id) {
        target.innerHTML = `<section class="wiki-editor-shell"><div class="wiki-editor-head"><div><h3>문서 편집</h3><p>위키 문법으로 문단 링크, 다른 강의 링크, 각주와 사진을 편집할 수 있습니다.</p></div></div><textarea class="wiki-source-editor" data-wiki-source spellcheck="false">${escapeHtml(source)}</textarea>${wikiSyntaxHelpMarkup()}<div class="wiki-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-wiki-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-wiki-save>저장하기</button><button class="jbl-btn jbl-save-btn" type="button" data-wiki-save-html>HTML 저장하기</button></div></section>`;
        const applySource = () => {
          lectureNoteSources[course.id] = target.querySelector('[data-wiki-source]').value;
          window.LECTURE_NOTE_SOURCES = lectureNoteSources;
          jblHasUnsavedChanges = true;
        };
        target.querySelector('[data-wiki-cancel]').addEventListener('click', () => { noteEditingCourseId = null; renderContentPanel(course); });
        target.querySelector('[data-wiki-save]').addEventListener('click', () => { applySource(); noteEditingCourseId = null; renderContentPanel(course); });
        target.querySelector('[data-wiki-save-html]').addEventListener('click', () => { applySource(); noteEditingCourseId = null; renderContentPanel(course); saveModifiedHtml(); });
        return true;
      }
      target.innerHTML = renderWikiDocument(source, course);
      target.querySelector('[data-wiki-edit]').addEventListener('click', () => { noteEditingCourseId = course.id; renderContentPanel(course); });
      bindWikiDocument(target, course);
      return true;
    }

    function questionCardMarkup(question, state) {
      const wikiCourse = byId(question.lectureIds?.[0]) || courses[0];
      const renderJblInline = value => renderWikiInline(value, wikiCourse, { items:[], named:new Map() }, false);
      const selected = state.selected[question.id];
      const revealAnswer = Boolean(state.answerShown[question.id]);
      const revealExplanation = Boolean(state.explanationShown[question.id]);
      const answerIndices = Array.isArray(question.answerIndices) && question.answerIndices.length ? question.answerIndices : (question.answerIndex ? [question.answerIndex] : []);
      const selectedIndices = Array.isArray(selected) ? selected : (selected ? [selected] : []);
      const isMultipleAnswer = answerIndices.length > 1;
      const selectionComplete = isMultipleAnswer && selectedIndices.length === answerIndices.length;
      const choices = question.choices.length ? `<div class="jbl-choices">${question.choices.map((choice,index) => {
        const number = index + 1;
        let status = '';
        if (revealAnswer) {
          if (answerIndices.includes(number)) status = ' correct';
          else if (selectedIndices.includes(number)) status = ' wrong';
        } else if (isMultipleAnswer && !selectionComplete) {
          if (selectedIndices.includes(number)) status = ' selected';
        } else if (selectedIndices.length) {
          if (answerIndices.includes(number)) status = ' correct';
          if (selectedIndices.includes(number) && answerIndices.length && !answerIndices.includes(number)) status = ' wrong';
        }
        return `<button class="jbl-choice${status}" type="button" data-jbl-choice="${number}"><span class="jbl-choice-num">${number}</span><span>${renderJblInline(choice)}</span></button>`;
      }).join('')}</div>` : '';
      const passageText = (question.passage || '').trim();
      const passage = passageText ? `<section class="jbl-passage" aria-label="제시문"><div class="jbl-passage-title">제시문</div><div class="jbl-passage-text">${renderJblWikiFragment(passageText, question)}</div></section>` : '';
      const images = question.images.length ? `<div class="jbl-page-block"><div class="jbl-page-title">문항 이미지</div>${question.images.map(filename => `<figure style="margin:0"><img class="jbl-page-img" data-jbl-image src="${escapeHtml(encodeURI(filename))}" alt="${escapeHtml(question.displayId)} 문항 이미지" /></figure>`).join('')}</div>` : '';
      const lecturePills = question.lectureIds.map(id => { const course = byId(id); return `<span class="jbl-lecture-map">${escapeHtml(course ? `${course.id} ${titleText(course)}` : `${id}강`)}</span>`; }).join('');
      const isEditing = state.editing === question.id;
      const lectureEditor = isEditing ? `<div class="jbl-editor-field full"><label>강의 분류 · 여러 강의를 함께 선택할 수 있습니다.</label><details class="jbl-lecture-picker" data-jbl-edit-lecture-picker><summary>${escapeHtml(questionCourseText(question) || '강의를 선택하세요')}</summary><div class="jbl-lecture-options">${courses.slice().sort((a,b) => a.id - b.id).map(course => `<label class="jbl-lecture-option"><input type="checkbox" value="${course.id}" data-jbl-edit-lecture ${question.lectureIds.includes(course.id) ? 'checked' : ''} /><span>${course.id}. ${escapeHtml(titleText(course))} · ${escapeHtml(course.professor)} 교수</span></label>`).join('')}</div></details><p class="jbl-editor-validation" data-jbl-edit-lecture-error hidden>강의를 하나 이상 선택하세요.</p></div>` : '';
      const editor = isEditing ? `<section class="jbl-editor jbl-question-editor" aria-label="문제 수정"><div class="jbl-editor-grid">${lectureEditor}<div class="jbl-editor-field full"><label for="jbl-edit-question-${escapeHtml(question.id)}">문제 발문</label><textarea id="jbl-edit-question-${escapeHtml(question.id)}" data-jbl-edit-question>${escapeHtml(question.question)}</textarea></div><div class="jbl-editor-field full"><label for="jbl-edit-passage-${escapeHtml(question.id)}">제시문 · ㄱ/ㄴ/ㄷ/ㄹ, I/II/III 등</label><textarea id="jbl-edit-passage-${escapeHtml(question.id)}" data-jbl-edit-passage>${escapeHtml(question.passage || '')}</textarea></div><div class="jbl-editor-field full"><label for="jbl-edit-choices-${escapeHtml(question.id)}">선지 · 한 줄에 하나씩 입력</label><textarea id="jbl-edit-choices-${escapeHtml(question.id)}" data-jbl-edit-choices>${escapeHtml(question.choices.join('\n'))}</textarea></div><div class="jbl-editor-field"><label for="jbl-edit-indices-${escapeHtml(question.id)}">정답 번호 · 복수 정답은 쉼표로 구분</label><input id="jbl-edit-indices-${escapeHtml(question.id)}" data-jbl-edit-indices type="text" inputmode="numeric" value="${escapeHtml(answerIndices.join(', '))}" placeholder="예: 2 또는 2, 4" /></div><div class="jbl-editor-field"><label for="jbl-edit-label-${escapeHtml(question.id)}">정답 표시</label><input id="jbl-edit-label-${escapeHtml(question.id)}" data-jbl-edit-label type="text" value="${escapeHtml(question.answerLabel)}" /></div><div class="jbl-editor-field full"><label for="jbl-edit-explanation-${escapeHtml(question.id)}">해설</label><textarea id="jbl-edit-explanation-${escapeHtml(question.id)}" data-jbl-edit-explanation>${escapeHtml(question.explanation)}</textarea></div></div><p class="jbl-editor-help">강의 분류·발문·제시문·선지·정답·해설을 한 번에 수정합니다. Wiki와 같은 문법 및 {{123}} 형식의 문항 링크를 사용할 수 있습니다.</p>${wikiSyntaxHelpMarkup()}<div class="jbl-editor-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-edit-cancel>취소</button><button class="jbl-btn jbl-btn-primary" type="button" data-jbl-edit-apply>수정 반영</button></div></section>` : '';
      return `<article class="jbl-card" data-jbl-question="${escapeHtml(question.id)}">
        <header class="jbl-card-head"><div class="jbl-meta"><span class="jbl-prof">${escapeHtml(question.legacyProfessor || question.professor)} 교수</span><div class="jbl-meta-right"><span class="jbl-qid">${escapeHtml(question.displayId)}</span><button class="jbl-favorite ${jblFavorites.has(question.id) ? 'active' : ''}" type="button" data-jbl-favorite aria-label="${jblFavorites.has(question.id) ? '즐겨찾기 해제' : '즐겨찾기 추가'}" aria-pressed="${jblFavorites.has(question.id)}">${jblFavorites.has(question.id) ? '★' : '☆'}</button></div></div><h2 class="jbl-title">${renderJblInline(question.question)}</h2><div class="jbl-source">${escapeHtml(question.source)}</div></header>
        <div class="jbl-card-body">${passage}${images}${choices}<div class="jbl-btns"><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-answer>${revealAnswer ? '정답 닫기' : '정답 보기'}</button><button class="jbl-btn jbl-btn-primary" type="button" data-jbl-explanation>${revealExplanation ? '해설 닫기' : '해설 보기'}</button><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-edit>${isEditing ? '문제 수정 닫기' : '문제 수정'}</button></div>${editor}${revealAnswer ? `<div class="jbl-answer-box">${renderJblWikiFragment(question.answerLabel, question)}</div>` : ''}${revealExplanation ? `<section class="jbl-explanation"><div class="jbl-explanation-title">해설</div><div class="jbl-lecture-row">${lecturePills}<span class="jbl-professor-name">${escapeHtml(question.professor)} 교수</span></div><div class="jbl-explanation-text">${renderJblWikiFragment(question.explanation, question)}</div></section>` : ''}</div>
      </article>`;
    }

    function bindQuestionCard(container, questions, key, rerender) {
      const state = viewerState(key);
      const question = questions[state.index];
      if (!question) return;
      bindWikiDocument(container, byId(question.lectureIds?.[0]) || courses[0]);
      container.querySelectorAll('[data-jbl-choice]').forEach(button => button.addEventListener('click', event => {
        if (event.target.closest('a')) return;
        const choiceNumber = Number(button.dataset.jblChoice);
        const answerIndices = Array.isArray(question.answerIndices) && question.answerIndices.length ? question.answerIndices : (question.answerIndex ? [question.answerIndex] : []);
        state.answerShown[question.id] = false;
        if (answerIndices.length > 1) {
          const current = Array.isArray(state.selected[question.id]) ? state.selected[question.id].slice() : [];
          const existingIndex = current.indexOf(choiceNumber);
          if (existingIndex >= 0) current.splice(existingIndex, 1);
          else if (current.length < answerIndices.length) current.push(choiceNumber);
          state.selected[question.id] = current;
        } else {
          state.selected[question.id] = choiceNumber;
        }
        rerender();
      }));
      container.querySelector('[data-jbl-answer]')?.addEventListener('click', () => {
        const willShow = !state.answerShown[question.id];
        state.answerShown[question.id] = willShow;
        if (!willShow) delete state.selected[question.id];
        rerender();
      });
      container.querySelector('[data-jbl-explanation]')?.addEventListener('click', () => {
        state.explanationShown[question.id] = !state.explanationShown[question.id];
        rerender();
      });
      container.querySelector('[data-jbl-favorite]')?.addEventListener('click', () => {
        if (jblFavorites.has(question.id)) jblFavorites.delete(question.id);
        else jblFavorites.add(question.id);
        saveJblFavorites();
        rerender();
      });
      container.querySelector('[data-jbl-edit]')?.addEventListener('click', () => {
        state.editing = state.editing === question.id ? null : question.id;
        rerender();
      });
      container.querySelector('[data-jbl-edit-cancel]')?.addEventListener('click', () => {
        state.editing = null;
        rerender();
      });
      container.querySelectorAll('[data-jbl-edit-lecture]').forEach(checkbox => checkbox.addEventListener('change', () => {
        container.querySelector('[data-jbl-edit-lecture-error]')?.setAttribute('hidden', '');
      }));
      container.querySelector('[data-jbl-edit-apply]')?.addEventListener('click', () => {
        const editedQuestion = container.querySelector('[data-jbl-edit-question]').value.trim();
        const editedPassage = container.querySelector('[data-jbl-edit-passage]').value.split(/\r?\n/).map(line => line.trim()).filter(Boolean).join('\n');
        const editedChoices = container.querySelector('[data-jbl-edit-choices]').value.split(/\r?\n/).map(choice => choice.trim()).filter(Boolean);
        const editedLectureIds = [...container.querySelectorAll('[data-jbl-edit-lecture]:checked')].map(checkbox => Number(checkbox.value)).filter(id => byId(id));
        if (!editedLectureIds.length) {
          const picker = container.querySelector('[data-jbl-edit-lecture-picker]');
          const error = container.querySelector('[data-jbl-edit-lecture-error]');
          if (picker) picker.open = true;
          if (error) error.hidden = false;
          picker?.scrollIntoView({ behavior:'smooth', block:'center' });
          return;
        }
        if (!editedQuestion) return;
        const editedIndices = [...new Set(container.querySelector('[data-jbl-edit-indices]').value.split(/[,·/\s]+/).map(Number).filter(index => Number.isInteger(index) && index >= 1 && index <= editedChoices.length))];
        const answerLabel = container.querySelector('[data-jbl-edit-label]').value.trim();
        const explanation = container.querySelector('[data-jbl-edit-explanation]').value.trim();
        question.question = editedQuestion;
        question.passage = editedPassage;
        question.choices = editedChoices;
        question.answerIndices = editedIndices;
        question.answerIndex = editedIndices.length === 1 ? editedIndices[0] : null;
        const numberText = editedIndices.join('·');
        const choiceText = editedIndices.map(index => editedChoices[index - 1]).join(' / ');
        question.answerLabel = answerLabel || (editedIndices.length ? `정답: ${numberText}번${choiceText ? ` · ${choiceText}` : ''}` : '정답: 미입력');
        question.explanation = explanation;
        const primaryCourse = byId(editedLectureIds[0]);
        question.lectureIds = editedLectureIds;
        question.lectureId = primaryCourse.id;
        question.lectureTitle = primaryCourse.title;
        question.professor = primaryCourse.professor;
        question.domain = primaryCourse.domain;
        question.discipline = primaryCourse.discipline;
        question.section = primaryCourse.section;
        question.mappingConfidence = '사이트에서 직접 수정';
        delete state.selected[question.id];
        window.JBL_DATA.modifiedAt = new Date().toISOString();
        jblHasUnsavedChanges = true;
        state.editing = null;
        state.answerShown[question.id] = true;
        state.explanationShown[question.id] = true;
        rerender();
      });
      container.querySelectorAll('[data-jbl-image]').forEach(image => {
        image.addEventListener('error', () => {
          image.closest('figure').hidden = true;
          const block = image.closest('.jbl-page-block');
          if (block && !block.querySelector('figure:not([hidden])')) block.hidden = true;
        });
        image.addEventListener('click', () => openJblImage(image.src));
      });
    }

    function renderQuestionCard(container, questions, key, rerender) {
      const state = viewerState(key);
      state.index = Math.max(0, Math.min(state.index, Math.max(questions.length - 1, 0)));
      if (!questions.length) {
        container.innerHTML = `<div class="jbl-empty"><strong>${key === 'jbl-all' ? '필터 조건에 맞는 문항이 없습니다.' : '이 강의에 연결된 기출 문항이 없습니다.'}</strong></div>`;
        return;
      }
      container.innerHTML = questionCardMarkup(questions[state.index], state);
      bindQuestionCard(container, questions, key, rerender);
    }

    function navMarkup(state, questions) {
      return `<button class="jbl-btn jbl-btn-primary" type="button" data-jbl-prev ${state.index === 0 ? 'disabled' : ''}>← 이전 문제</button><div class="jbl-counter">${questions.length ? state.index + 1 : 0} / ${questions.length}</div><button class="jbl-btn jbl-btn-primary" type="button" data-jbl-next ${state.index >= questions.length - 1 ? 'disabled' : ''}>다음 문제 →</button>`;
    }

    function scrollCurrentQuestionToTop(key) {
      requestAnimationFrame(() => {
        const standalone = key === 'jbl-all';
        const scope = document.querySelector(standalone ? '#jbl-standalone' : '#content-panel');
        const card = scope?.querySelector('.jbl-card');
        if (!card) return;
        const mobileStandalone = standalone && window.matchMedia('(max-width: 760px)').matches;
        if (mobileStandalone) {
          jblQuestionScrollLockedUntil = Date.now() + 900;
          setJblTopbarHidden(true);
        }
        const topbar = standalone && !mobileStandalone ? scope.querySelector('.jbl-topbar') : null;
        const topbarOffset = topbar ? topbar.getBoundingClientRect().height + 8 : 0;
        const cardTop = window.scrollY + card.getBoundingClientRect().top - topbarOffset;
        window.scrollTo({ top:Math.max(0, cardTop), behavior:'smooth' });
      });
    }

    function bindViewerNav(container, questions, key, rerender) {
      const state = viewerState(key);
      container.querySelector('[data-jbl-prev]')?.addEventListener('click', () => { state.index -= 1; rerender(); scrollCurrentQuestionToTop(key); });
      container.querySelector('[data-jbl-next]')?.addEventListener('click', () => { state.index += 1; rerender(); scrollCurrentQuestionToTop(key); });
    }

    function saveModifiedHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('body')?.classList.remove('jbl-mode');
      clone.querySelectorAll('.view').forEach(view => { view.hidden = view.id !== 'catalog-view'; });
      clone.querySelector('#jbl-image-modal')?.classList.remove('show');
      clone.querySelector('#jbl-image-modal img')?.removeAttribute('src');
      const dataScript = clone.querySelector('#jbl-data-script, script[src="./jbl-data.js"]');
      const payload = JSON.stringify(window.JBL_DATA).replace(/</g, '\\u003c');
      dataScript.id = 'jbl-data-script';
      dataScript.removeAttribute('src');
      dataScript.textContent = `window.JBL_DATA = ${payload};`;
      const noteDataScript = clone.querySelector('#lecture-note-data, script[src="./lecture-notes.js"]');
      const notePayload = JSON.stringify(lectureNoteSources).replace(/</g, '\\u003c');
      noteDataScript.id = 'lecture-note-data';
      noteDataScript.removeAttribute('src');
      noteDataScript.textContent = `window.LECTURE_NOTE_SOURCES = ${notePayload};`;
      const blob = new Blob([`<!DOCTYPE html>\n${clone.outerHTML}`], { type:'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = '소화기계_강의정리_수정본.html';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      jblHasUnsavedChanges = false;
    }

    function bindHtmlSave(container) {
      container.querySelectorAll('[data-jbl-save-html]').forEach(button => button.addEventListener('click', saveModifiedHtml));
    }

    function renderCourseJ(course) {
      const target = document.querySelector('#content-panel');
      const questions = jblQuestions.filter(question => question.lectureIds.includes(course.id));
      const key = `course-${course.id}`;
      const state = viewerState(key);
      const rerender = () => renderCourseJ(course);
      target.innerHTML = `<div class="jbl-embed"><div data-jbl-course-root></div><div class="jbl-inline-nav">${navMarkup(state, questions)}</div></div>`;
      renderQuestionCard(target.querySelector('[data-jbl-course-root]'), questions, key, rerender);
      bindViewerNav(target.querySelector('.jbl-inline-nav'), questions, key, rerender);
    }

    function renderJblStandalone() {
      const target = document.querySelector('#jbl-standalone');
      const key = 'jbl-all';
      const state = standaloneState();
      const linkedMode = Boolean(state.linkedQuestionNumber);
      const questions = currentStandaloneQuestions();
      state.index = Math.max(0, Math.min(state.index, Math.max(questions.length - 1, 0)));
      const currentQuestion = questions[state.index];
      const years = [...new Set(jblQuestions.map(question => Number(question.year)).filter(Boolean))].sort((a,b) => b-a);
      const lectureIds = [...new Set(jblQuestions.flatMap(question => question.lectureIds))].sort((a,b) => a-b);
      const professors = [...new Set(jblQuestions.map(question => question.professor).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ko'));
      const filterPanel = state.panel === 'filter' ? `<section class="jbl-filter-panel" aria-label="문항 필터"><h2 class="jbl-filter-title">필터</h2><div class="jbl-filter-grid"><div class="jbl-filter-item"><label for="jbl-filter-year">연도</label><select id="jbl-filter-year" class="jbl-select" data-jbl-filter-year><option value="">전체 연도</option>${years.map(year => `<option value="${year}" ${String(state.filters.year) === String(year) ? 'selected' : ''}>${year}</option>`).join('')}</select></div><div class="jbl-filter-item"><label for="jbl-filter-lecture">강의명</label><select id="jbl-filter-lecture" class="jbl-select" data-jbl-filter-lecture><option value="">전체 강의</option>${lectureIds.map(id => { const course = byId(id); return `<option value="${id}" ${String(state.filters.lectureId) === String(id) ? 'selected' : ''}>${escapeHtml(course ? `${course.id} ${titleText(course)}` : `${id}강`)}</option>`; }).join('')}</select></div><div class="jbl-filter-item"><label for="jbl-filter-professor">교수명</label><select id="jbl-filter-professor" class="jbl-select" data-jbl-filter-professor><option value="">전체 교수</option>${professors.map(professor => `<option value="${escapeHtml(professor)}" ${state.filters.professor === professor ? 'selected' : ''}>${escapeHtml(professor)} 교수</option>`).join('')}</select></div><div class="jbl-filter-item"><label>즐겨찾기</label><label class="jbl-favorite-filter"><input type="checkbox" data-jbl-filter-favorites ${state.filters.favoritesOnly ? 'checked' : ''} /> 즐겨찾기한 문제만 보기</label></div></div><p class="jbl-filter-summary">전체 ${jblQuestions.length}문항 중 ${questions.length}문항 표시${state.randomOrder.length ? ' · 랜덤 순서' : ''}</p></section>` : '';
      const settingsPanel = state.panel === 'settings' ? `<section class="jbl-filter-panel" aria-label="JBL 설정"><h2 class="jbl-filter-title">설정</h2><div class="jbl-settings-actions"><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-random>문항 랜덤 표시</button><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-reset>초기화</button><button class="jbl-btn jbl-btn-sub" type="button" data-jbl-exit>강의 화면</button><button class="jbl-btn jbl-save-btn" type="button" data-jbl-save-html>HTML 저장하기</button></div></section>` : '';
      target.innerHTML = `<div class="jbl-wrap"><section class="jbl-panel jbl-topbar"><div class="jbl-top-actions">${linkedMode ? `<button class="jbl-btn jbl-btn-sub" type="button" data-jbl-linked-back>← 돌아가기</button>` : `<button class="jbl-btn jbl-btn-sub jbl-toolbar-btn ${state.panel === 'filter' ? 'active' : ''}" type="button" data-jbl-panel="filter" aria-expanded="${state.panel === 'filter'}">필터</button><button class="jbl-btn jbl-btn-sub jbl-toolbar-btn ${state.panel === 'settings' ? 'active' : ''}" type="button" data-jbl-panel="settings" aria-expanded="${state.panel === 'settings'}">설정</button>`}<button class="jbl-btn jbl-btn-primary" type="button" data-jbl-open-lecture ${currentQuestion?.lectureIds?.length ? '' : 'disabled'}>강의 보기</button></div><div class="jbl-jump-box"><label for="jbl-jump" style="font-size:14px;font-weight:800;color:#475569">문제 번호 이동</label><input id="jbl-jump" type="text" inputmode="numeric" placeholder="예: 472" /><button class="jbl-btn jbl-btn-primary" type="button" data-jbl-jump>이동</button></div></section>${linkedMode ? '' : filterPanel}${linkedMode ? '' : settingsPanel}<div data-jbl-root></div></div><div class="jbl-bottom-nav"><div class="jbl-bottom-inner">${navMarkup(state, questions)}</div></div>`;
      const rerender = renderJblStandalone;
      renderQuestionCard(target.querySelector('[data-jbl-root]'), questions, key, rerender);
      bindViewerNav(target.querySelector('.jbl-bottom-inner'), questions, key, rerender);
      bindHtmlSave(target);
      target.querySelector('[data-jbl-linked-back]')?.addEventListener('click', () => history.back());
      target.querySelectorAll('[data-jbl-panel]').forEach(button => button.addEventListener('click', () => {
        state.panel = state.panel === button.dataset.jblPanel ? null : button.dataset.jblPanel;
        renderJblStandalone();
      }));
      const updateFilter = (name, value) => {
        state.filters[name] = value;
        state.index = 0;
        clearJblRandomOrder(state);
        renderJblStandalone();
      };
      target.querySelector('[data-jbl-filter-year]')?.addEventListener('change', event => updateFilter('year', event.target.value));
      target.querySelector('[data-jbl-filter-lecture]')?.addEventListener('change', event => updateFilter('lectureId', event.target.value));
      target.querySelector('[data-jbl-filter-professor]')?.addEventListener('change', event => updateFilter('professor', event.target.value));
      target.querySelector('[data-jbl-filter-favorites]')?.addEventListener('change', event => updateFilter('favoritesOnly', event.target.checked));
      target.querySelector('[data-jbl-random]')?.addEventListener('click', () => {
        const filtered = filteredJblQuestions();
        state.randomOrder = shuffleQuestions(filtered).map(question => question.id);
        state.randomSignature = jblFilterSignature(state.filters);
        state.index = 0;
        renderJblStandalone();
      });
      target.querySelector('[data-jbl-exit]')?.addEventListener('click', () => { renderDomainTabs(); renderCatalog(); showView('catalog'); });
      target.querySelector('[data-jbl-reset]')?.addEventListener('click', () => {
        state.linkedQuestionNumber = null;
        state.filters = { year:'', lectureId:'', professor:'', favoritesOnly:false };
        state.index = 0;
        state.selected = {};
        state.answerShown = {};
        state.explanationShown = {};
        state.editing = null;
        clearJblRandomOrder(state);
        renderJblStandalone();
      });
      target.querySelector('[data-jbl-open-lecture]')?.addEventListener('click', () => {
        const question = currentStandaloneQuestions()[state.index];
        const courseId = question?.lectureIds?.[0];
        if (!courseId) return;
        history.pushState(null, '', `#lecture-${courseId}`);
        showDetail(courseId, 'jbl');
      });
      const jump = () => {
        const value = target.querySelector('#jbl-jump').value.trim();
        const globalMatch = value.match(/^\s*(\d+)\s*번?\s*$/);
        if (globalMatch) {
          const globalNumber = Number(globalMatch[1]);
          openJblQuestionNumber(globalNumber);
          return;
        }
        const yearMatch = value.match(/20(?:20|21|22|23|25)/);
        const requestedYear = yearMatch ? Number(yearMatch[0]) : null;
        const withoutYear = value.replace(/20(?:20|21|22|23|25)/, ' ').trim();
        const numberMatch = withoutYear.match(/(\d+)/);
        let index = -1;
        if (numberMatch && /오답/.test(value)) {
          const number = Number(numberMatch[1]);
          index = questions.findIndex(question => question.sourceType === '오답30'
            && (!requestedYear || question.year === requestedYear)
            && (question.sourceOrdinal === number || question.id.endsWith(`wrong30-${number}`)));
        } else if (numberMatch) {
          const number = Number(numberMatch[1]);
          index = questions.findIndex(question => question.originalNumber === number
            && (!requestedYear || question.year === requestedYear));
        }
        if (index >= 0) { state.index=index; renderJblStandalone(); }
      };
      target.querySelector('[data-jbl-jump]')?.addEventListener('click', jump);
      target.querySelector('#jbl-jump')?.addEventListener('keydown', event => { if (event.key === 'Enter') jump(); });
      requestAnimationFrame(() => setJblTopbarHidden(jblTopbarHidden));
    }

    function openJblQuestionNumber(globalNumber) {
      const question = jblQuestions.find(item => item.globalNumber === Number(globalNumber));
      if (!question) return false;
      if (location.hash.startsWith('#lecture-')) {
        history.replaceState({ ...(history.state || {}), detailTab:activeDetailTab }, '', location.href);
      }
      const state = standaloneState();
      state.linkedQuestionNumber = Number(globalNumber);
      state.panel = null;
      state.index = 0;
      showView('jbl', false);
      history.pushState({ jblLinkedQuestion:Number(globalNumber) }, '', `#jbl-q-${globalNumber}`);
      renderJblStandalone();
      window.scrollTo({ top:0, behavior:'smooth' });
      return true;
    }

    function openJblImage(src) {
      const modal = document.querySelector('#jbl-image-modal');
      modal.querySelector('img').src = src;
      modal.classList.add('show');
    }

    function closeJblImage() {
      const modal = document.querySelector('#jbl-image-modal');
      modal.classList.remove('show');
      modal.querySelector('img').removeAttribute('src');
    }

    function renderDomainTabs() {
      const target = document.querySelector('#domain-tabs');
      target.innerHTML = Object.keys(domainMeta).map(domain => {
        const meta = domainMeta[domain];
        const count = courses.filter(course => course.domain === domain).length;
        return `<button class="domain-tab ${activeDomain === domain ? 'active' : ''}" style="--tab-color:${meta.accent};--tab-soft:${meta.soft}" data-domain="${domain}" type="button"><strong>${domain}</strong></button>`;
      }).join('');
      target.querySelectorAll('[data-domain]').forEach(button => button.addEventListener('click', () => {
        activeDomain = button.dataset.domain;
        renderDomainTabs();
        renderCatalog();
      }));
    }

    function renderCatalog() {
      const target = document.querySelector('#catalog');
      const domainCourses = courses.filter(course => course.domain === activeDomain);
      const meta = domainMeta[activeDomain];
      const disciplines = [...new Set(domainCourses.map(course => course.discipline))].sort((a,b) => disciplineOrder.indexOf(a)-disciplineOrder.indexOf(b));
      target.innerHTML = `<div class="discipline-grid">${disciplines.map(discipline => {
        const disciplineCourses = domainCourses.filter(course => course.discipline === discipline);
        const [icon,en] = disciplineMeta[discipline];
        const sections = [...new Set(disciplineCourses.map(course => course.section))].sort((a,b) => sectionOrder.indexOf(a)-sectionOrder.indexOf(b));
        return `<article class="discipline-card" style="--accent:${meta.accent};--soft:${meta.soft}">
          <header class="discipline-head"><span class="discipline-icon" aria-hidden="true">${icon}</span><div><h3>${discipline}</h3></div><span class="discipline-count">${disciplineCourses.length}강</span></header>
          ${sections.map(section => {
            const sectionCourses = disciplineCourses.filter(course => course.section === section);
            const professors = [...new Set(sectionCourses.map(course => course.professor))].sort((a,b) => {
              const minA = Math.min(...sectionCourses.filter(c => c.professor === a).map(c => c.id));
              const minB = Math.min(...sectionCourses.filter(c => c.professor === b).map(c => c.id));
              return minA-minB;
            });
            const showSection = sections.length > 1 || section !== discipline;
            return `<section class="section-block">${showSection ? `<h4 class="section-title">${section}</h4>` : ''}<div class="professor-list">
              ${professors.map(professor => {
                const lectures = sectionCourses.filter(course => course.professor === professor).sort((a,b) => a.id-b.id);
                return `<div class="professor"><button class="professor-toggle" type="button" aria-expanded="false"><span class="professor-name">${professor} 교수</span><span class="professor-meta">${lectures.length}개 강의</span><span class="chevron" aria-hidden="true">⌄</span></button><ul class="lecture-list">${lectures.map(course => `<li><button class="lecture-link" type="button" data-course="${course.id}"><span class="lecture-no">${course.id}</span><span>${titleText(course)}</span><small>${course.slots[0] ? `${course.slots[0].week}주차` : ''}</small><span class="lecture-arrow" aria-hidden="true">→</span></button></li>`).join('')}</ul></div>`;
              }).join('')}
            </div></section>`;
          }).join('')}
        </article>`;
      }).join('')}</div>`;

      target.querySelectorAll('.professor-toggle').forEach(button => button.addEventListener('click', () => {
        const professor = button.closest('.professor');
        const isOpen = professor.classList.toggle('open');
        button.setAttribute('aria-expanded', String(isOpen));
      }));
      target.querySelectorAll('[data-course]').forEach(button => button.addEventListener('click', () => showDetail(button.dataset.course, 'catalog')));
    }

    function renderSchedule() {
      const target = document.querySelector('#week-stack');
      target.innerHTML = [1,2,3,4,5].map(week => {
        const weekSlots = courses.flatMap(course => course.slots.filter(slot => slot.week === week).map(slot => ({course,slot})));
        const weekDates = weekCalendar[week];
        return `<article class="week-card"><div class="week-title"><strong>${week}주차</strong><span>${formatDate(weekDates.월)} – ${formatDate(weekDates.금)}</span></div><div class="timetable-scroll"><div class="timetable">
          <div class="grid-cell day-head" style="grid-column:1;grid-row:1">시간</div>
          ${days.map((day,index) => `<div class="grid-cell day-head" style="grid-column:${index+2};grid-row:1">${day}<small>${formatDate(weekDates[day])}</small></div>`).join('')}
          ${hours.map((hour,row) => `<div class="grid-cell time-cell ${hour === '13:00' ? 'lunch-cell' : ''}" style="grid-column:1;grid-row:${row+2}">${hour}</div>${days.map((day,col) => `<div class="grid-cell ${hour === '13:00' ? 'lunch-cell' : ''}" style="grid-column:${col+2};grid-row:${row+2}"></div>`).join('')}`).join('')}
          ${days.map((day,index) => holidays.has(weekDates[day]) ? `<div class="holiday-column" style="grid-column:${index+2};grid-row:2 / span 9"><span>추석</span></div>` : '').join('')}
          ${weekSlots.map(({course,slot}) => {
            const col = days.indexOf(slot.day)+2;
            const row = hours.indexOf(slot.time)+2;
            const color = course.isLab ? 'var(--violet)' : (course.domain === '기초의학' ? 'var(--basic)' : 'var(--clinical)');
            const soft = course.isLab ? '#eeeafb' : (course.domain === '기초의학' ? 'var(--basic-soft)' : 'var(--clinical-soft)');
            const span = slot.duration || 1;
            return `<div class="course-slot" style="grid-column:${col};grid-row:${row} / span ${span};--course-color:${color};--course-soft:${soft}"><button class="course-card" type="button" data-course="${course.id}" aria-label="${course.id} ${course.title}, ${pathText(course)}"><span class="number">${course.id}${course.isLab ? ' · 실습' : ''}</span><span class="name">${course.title}</span><span class="teacher">${course.professor} 교수</span><span class="course-tooltip" role="tooltip">${pathText(course)}</span></button></div>`;
          }).join('')}
        </div></div></article>`;
      }).join('');
      target.querySelectorAll('[data-course]').forEach(button => button.addEventListener('click', () => showDetail(button.dataset.course, 'schedule')));
    }

    function showView(name, updateHistory = true) {
      document.querySelectorAll('.view').forEach(view => { view.hidden = view.id !== `${name}-view`; });
      document.body.classList.toggle('jbl-mode', name === 'jbl');
      setJblTopbarHidden(false);
      jblLastScrollY = 0;
      window.scrollTo({top:0, behavior:'smooth'});
      if (updateHistory) history.replaceState(null, '', name === 'catalog' ? '#catalog' : `#${name}`);
    }

    function showDetail(id, from = 'catalog', initialTab = '정리본') {
      const course = byId(id);
      if (!course) return;
      const orderedCourses = courses.slice().sort((a,b) => a.id - b.id);
      const courseIndex = orderedCourses.findIndex(item => item.id === course.id);
      const previousCourse = courseIndex > 0 ? orderedCourses[courseIndex - 1] : null;
      const nextCourse = courseIndex >= 0 && courseIndex < orderedCourses.length - 1 ? orderedCourses[courseIndex + 1] : null;
      previousView = from;
      activeDetailTab = ['정리본','J','KMLE'].includes(initialTab) ? initialTab : '정리본';
      noteEditingCourseId = null;
      const slotText = course.slots.map(slot => `${slot.week}주차 · ${formatDate(slot.date)}(${slot.day}) ${slot.time} · ${slot.duration}시간`).join(' / ');
      const target = document.querySelector('#detail');
      target.innerHTML = `<div class="detail-bar">${from === 'jbl' ? '<div class="detail-return"><button class="jbl-btn jbl-btn-sub" type="button" data-detail-back>← 돌아가기</button></div>' : ''}<div class="detail-topline"><div><p class="detail-breadcrumb">${pathText(course)} · ${course.professor} 교수</p><h2>${titleText(course)}</h2><p class="detail-info">${slotText}</p></div><div class="detail-course-controls" aria-label="강의 번호 이동"><button class="content-tab detail-course-nav" type="button" data-detail-previous ${previousCourse ? '' : 'disabled'}>← 이전 강의</button><button class="content-tab detail-course-nav" type="button" data-detail-next ${nextCourse ? '' : 'disabled'}>다음 강의 →</button><form class="detail-number-form" data-detail-number-form><button class="detail-number" type="button" data-detail-number-button title="강의 번호를 입력하여 이동">${course.id}</button><input class="detail-number-input" data-detail-number-input type="text" inputmode="numeric" pattern="[0-9]*" value="${course.id}" aria-label="이동할 강의 번호" autocomplete="off" hidden /></form></div></div><div class="content-tabs" role="tablist" aria-label="강의 자료 종류">${['정리본','J','KMLE'].map(tab => `<button class="content-tab ${activeDetailTab === tab ? 'active' : ''}" type="button" role="tab" aria-selected="${activeDetailTab === tab}" data-detail-tab="${tab}">${detailTabLabel(tab)}</button>`).join('')}</div></div><div id="content-panel" class="content-panel"></div>`;
      target.querySelector('[data-detail-back]')?.addEventListener('click', () => history.back());
      const numberForm = target.querySelector('[data-detail-number-form]');
      const numberButton = target.querySelector('[data-detail-number-button]');
      const numberInput = target.querySelector('[data-detail-number-input]');
      const closeNumberInput = () => {
        numberInput.hidden = true;
        numberButton.hidden = false;
        numberInput.value = String(course.id);
        numberInput.setCustomValidity('');
      };
      numberButton.addEventListener('click', () => {
        numberButton.hidden = true;
        numberInput.hidden = false;
        numberInput.focus();
        numberInput.select();
      });
      numberInput.addEventListener('input', () => numberInput.setCustomValidity(''));
      numberInput.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        event.preventDefault();
        closeNumberInput();
        numberButton.focus();
      });
      numberInput.addEventListener('blur', () => window.setTimeout(() => {
        if (document.activeElement !== numberInput) closeNumberInput();
      }, 0));
      numberForm.addEventListener('submit', event => {
        event.preventDefault();
        const selectedCourse = byId(numberInput.value.trim());
        if (!selectedCourse) {
          numberInput.setCustomValidity('존재하는 강의 번호를 입력하세요.');
          numberInput.reportValidity();
          numberInput.select();
          return;
        }
        showDetail(selectedCourse.id, from, activeDetailTab);
      });
      target.querySelector('[data-detail-previous]')?.addEventListener('click', () => {
        if (previousCourse) showDetail(previousCourse.id, from, activeDetailTab);
      });
      target.querySelector('[data-detail-next]')?.addEventListener('click', () => {
        if (nextCourse) showDetail(nextCourse.id, from, activeDetailTab);
      });
      target.querySelectorAll('[data-detail-tab]').forEach(button => button.addEventListener('click', () => {
        activeDetailTab = button.dataset.detailTab;
        history.replaceState({ ...(history.state || {}), detailTab:activeDetailTab }, '', location.href);
        target.querySelectorAll('[data-detail-tab]').forEach(tab => { const active = tab === button; tab.classList.toggle('active', active); tab.setAttribute('aria-selected', String(active)); });
        renderContentPanel(course);
      }));
      renderContentPanel(course);
      showView('detail', false);
      history.replaceState({ ...(history.state || {}), detailTab:activeDetailTab }, '', `#lecture-${course.id}`);
    }

    function renderContentPanel(course) {
      const target = document.querySelector('#content-panel');
      const hasNote = Boolean(lectureNoteSources[course.id]);
      target.classList.toggle('j-mode', activeDetailTab === 'J');
      target.classList.toggle('notes-mode', activeDetailTab === '정리본' && hasNote);
      if (activeDetailTab === 'J') {
        renderCourseJ(course);
        return;
      }
      if (activeDetailTab === '정리본' && renderLectureNote(course, target)) return;
      target.innerHTML = `<span class="panel-label">${course.id}강 · ${detailTabLabel(activeDetailTab)}</span><h3>${detailTabLabel(activeDetailTab)}</h3><div class="empty-state"><div><strong>아직 작성된 내용이 없습니다.</strong></div></div>`;
    }

    document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => {
      const destination = button.dataset.go;
      if (destination === 'catalog') { renderDomainTabs(); renderCatalog(); }
      if (destination === 'schedule') renderSchedule();
      if (destination === 'jbl') { standaloneState().linkedQuestionNumber = null; renderJblStandalone(); }
      showView(destination);
    }));

    window.addEventListener('hashchange', routeFromHash);
    function routeFromHash() {
      const hash = location.hash;
      const linkedQuestion = hash.match(/^#jbl-q-(\d+)$/);
      if (linkedQuestion) {
        standaloneState().linkedQuestionNumber = Number(linkedQuestion[1]);
        renderJblStandalone();
        return showView('jbl', false);
      }
      if (hash.startsWith('#lecture-')) return showDetail(hash.replace('#lecture-',''), previousView, history.state?.detailTab || '정리본');
      if (hash === '#schedule') { renderSchedule(); return showView('schedule', false); }
      if (hash === '#jbl') { standaloneState().linkedQuestionNumber = null; renderJblStandalone(); return showView('jbl', false); }
      renderDomainTabs(); renderCatalog(); showView('catalog', false);
    }

    function activeQuestionViewer() {
      if (!document.querySelector('#jbl-view').hidden) {
        return { questions:currentStandaloneQuestions(), key:'jbl-all', rerender:renderJblStandalone };
      }
      if (!document.querySelector('#detail-view').hidden && activeDetailTab === 'J') {
        const match = location.hash.match(/^#lecture-(\d+)$/);
        const course = match ? byId(match[1]) : null;
        if (!course) return null;
        return {
          questions:jblQuestions.filter(question => question.lectureIds.includes(course.id)),
          key:`course-${course.id}`,
          rerender:() => renderCourseJ(course)
        };
      }
      return null;
    }

    function handleQuestionShortcut(event) {
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, button, [contenteditable="true"]')) return;
      if (document.querySelector('#jbl-image-modal').classList.contains('show')) return;
      const viewer = activeQuestionViewer();
      if (!viewer || !viewer.questions.length) return;
      const state = viewerState(viewer.key);
      const question = viewer.questions[state.index];
      if (!question) return;

      if (event.code === 'Space') {
        event.preventDefault();
        state.explanationShown[question.id] = !state.explanationShown[question.id];
        viewer.rerender();
        return;
      }

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        if (state.index <= 0) return;
        state.index -= 1;
        viewer.rerender();
        scrollCurrentQuestionToTop(viewer.key);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        if (state.index >= viewer.questions.length - 1) return;
        state.index += 1;
        viewer.rerender();
        scrollCurrentQuestionToTop(viewer.key);
      }
    }

    document.querySelector('#jbl-image-modal').addEventListener('click', event => { if (event.target.id === 'jbl-image-modal') closeJblImage(); });
    document.querySelector('.jbl-image-close').addEventListener('click', closeJblImage);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeJblImage(); });
    document.addEventListener('keydown', handleQuestionShortcut);
    window.addEventListener('scroll', handleJblTopbarScroll, { passive:true });
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 760px)').matches) setJblTopbarHidden(false);
      jblLastScrollY = Math.max(0, window.scrollY);
    });
    window.addEventListener('beforeunload', event => {
      if (!jblHasUnsavedChanges) return;
      event.preventDefault();
      event.returnValue = '';
    });

    renderDomainTabs();
    renderCatalog();
    if (location.hash && location.hash !== '#catalog') routeFromHash();
  </script>
</body>
</html>
