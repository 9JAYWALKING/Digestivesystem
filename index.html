<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="2026학년도 2학기 의학과 1학년 소화기계 강의 정리" />
  <title>소화기계 · 강의 정리</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #6c7680;
      --paper: #ffffff;
      --card: #ffffff;
      --line: #dce7ed;
      --deep: #3f7894;
      --deep-2: #5791ad;
      --basic: #53aed8;
      --basic-soft: #e9f7ff;
      --clinical: #dc7f87;
      --clinical-soft: #fff0f1;
      --violet: #6657b6;
      --topbar: #e7f7ff;
      --topbar-ink: #315f75;
      --shadow: 0 16px 38px rgba(61, 111, 137, .09);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: #ffffff;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.55;
    }

    button { font: inherit; }

    .site-shell { min-height: 100vh; }

    .masthead {
      padding: 18px clamp(20px, 5vw, 72px);
      color: #ffffff;
      background: var(--deep);
      border-bottom: 1px solid #356a83;
    }

    .masthead-inner,
    main { width: min(1480px, 100%); margin: 0 auto; }

    .masthead-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-family: inherit;
      font-size: clamp(21px, 3.2vw, 30px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    .nav-button,
    .back-button {
      border: 1px solid #abd7ea;
      border-radius: 999px;
      padding: 11px 17px;
      color: #315f75;
      background: rgba(255,255,255,.68);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible,
    .back-button:hover,
    .back-button:focus-visible {
      background: #ffffff;
      transform: translateY(-1px);
      outline: none;
    }

    .nav-button.primary { color: #244f63; background: #a8dff5; border-color: #8bcfea; font-weight: 800; }
    .nav-button[data-go="catalog"] { color: #244f63; background: #ffffff; border-color: #ffffff; }

    main { padding: 28px clamp(16px, 3vw, 48px) 80px; }

    .view[hidden] { display: none !important; }

    .domain-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .domain-tab {
      position: relative;
      overflow: hidden;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: #ffffff;
      text-align: left;
      cursor: pointer;
    }

    .domain-tab::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--tab-color); }
    .domain-tab.active { border-color: var(--tab-color); background: var(--tab-soft); box-shadow: 0 10px 30px rgba(36, 44, 48, .06); }
    .domain-tab strong { display: block; font-family: inherit; font-size: 20px; }

    .discipline-grid { display: grid; gap: 18px; }

    .discipline-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .discipline-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px 17px;
      border-bottom: 1px solid #e8f0f4;
    }

    .discipline-icon {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border-radius: 13px;
      background: var(--soft);
      font-size: 21px;
    }

    .discipline-head h3 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .discipline-head p { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
    .discipline-count { margin-left: auto; padding: 4px 9px; border-radius: 999px; color: var(--accent); background: var(--soft); font-size: 12px; font-weight: 800; }

    .section-block { padding: 17px 24px 22px; }
    .section-block + .section-block { border-top: 1px dashed #d9e7ed; }
    .section-title { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing: .04em; }
    .section-title::before { content: ""; width: 18px; height: 2px; background: var(--accent); }

    .professor-list { display: grid; gap: 8px; }

    .professor {
      border: 1px solid #dfeaf0;
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
    }

    .professor-toggle {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 14px 15px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .professor-toggle:hover { background: #f5fbfe; }
    .professor-name { font-weight: 850; }
    .professor-meta { margin-left: auto; color: var(--muted); font-size: 12px; }
    .chevron { color: var(--accent); transition: transform .2s ease; }
    .professor.open .chevron { transform: rotate(180deg); }

    .lecture-list { display: none; margin: 0; padding: 0 15px 14px; list-style: none; }
    .professor.open .lecture-list { display: grid; gap: 6px; }

    .lecture-link {
      display: grid;
      width: 100%;
      grid-template-columns: 34px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border: 0;
      border-radius: 10px;
      color: var(--ink);
      background: #f6fafc;
      text-align: left;
      cursor: pointer;
    }

    .lecture-link:hover,
    .lecture-link:focus-visible { background: var(--soft); outline: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); }
    .lecture-no { color: var(--accent); font-family: inherit; font-size: 16px; font-weight: 800; }
    .lecture-link small { color: var(--muted); }
    .lecture-arrow { color: var(--accent); }

    .schedule-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .schedule-toolbar h2 { margin: 0; font-family: inherit; font-size: clamp(24px, 4vw, 32px); }

    .legend { display: flex; gap: 8px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 11px; }
    .legend i { width: 9px; height: 9px; border-radius: 3px; }

    .week-stack { display: grid; gap: 22px; }
    .week-card { border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: var(--shadow); overflow: hidden; }
    .week-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 16px; color: #fff; background: var(--deep); }
    .week-title strong { font-family: inherit; font-size: 18px; }
    .week-title span { color: #d7e8f0; font-size: 12px; }
    .timetable-scroll { overflow-x: auto; }

    .timetable {
      min-width: 860px;
      display: grid;
      grid-template-columns: 72px repeat(5, minmax(150px, 1fr));
      grid-template-rows: 58px repeat(9, minmax(70px, auto));
      position: relative;
    }

    .grid-cell { min-width: 0; padding: 8px; border-right: 1px solid #ddd9d0; border-bottom: 1px solid #ddd9d0; background: #fff; }
    .day-head { display: grid; place-items: center; color: #314049; background: #eceae5; text-align: center; font-weight: 850; }
    .day-head small { display: block; margin-top: 1px; color: var(--muted); font-weight: 500; }
    .time-cell { display: grid; place-items: center; color: var(--muted); background: #f5fafc; font-size: 12px; font-weight: 800; }
    .lunch-cell { background: repeating-linear-gradient(135deg, #f5f9fb, #f5f9fb 8px, #edf4f7 8px, #edf4f7 16px); }

    .holiday-column {
      z-index: 5;
      display: grid;
      place-items: center;
      border-right: 1px solid #d1d7da;
      border-bottom: 1px solid #d1d7da;
      color: #dc858c;
      background: repeating-linear-gradient(135deg, #f5f9fb, #f5f9fb 8px, #edf4f7 8px, #edf4f7 16px);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .12em;
      pointer-events: none;
    }

    .course-slot { position: relative; z-index: 2; margin: 5px; min-width: 0; }
    .course-card {
      display: flex;
      width: 100%;
      height: calc(100% - 2px);
      min-height: 58px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--ink);
      background: var(--course-soft);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .course-card:hover,
    .course-card:focus-visible { z-index: 8; transform: translateY(-2px); box-shadow: 0 10px 23px rgba(20, 34, 40, .16); border-color: var(--course-color); outline: none; }
    .course-card .number { color: var(--course-color); font-family: inherit; font-size: 12px; font-weight: 900; }
    .course-card .name { display: -webkit-box; overflow: hidden; font-size: 12px; font-weight: 800; line-height: 1.35; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .course-card .teacher { color: var(--muted); font-size: 10px; }

    .course-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 9px);
      width: max-content;
      max-width: 300px;
      z-index: 20;
      padding: 9px 11px;
      border-radius: 9px;
      color: #fff;
      background: #14272f;
      box-shadow: 0 10px 25px rgba(0,0,0,.22);
      font-size: 11px;
      line-height: 1.4;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 5px);
      transition: opacity .15s ease, transform .15s ease;
    }

    .course-tooltip::after { content: ""; position: absolute; left: 50%; top: 100%; border: 6px solid transparent; border-top-color: #14272f; transform: translateX(-50%); }
    .course-card:hover .course-tooltip,
    .course-card:focus-visible .course-tooltip { opacity: 1; transform: translate(-50%, 0); }

    .detail-wrap { width: 100%; max-width: 1180px; margin: 0 auto; }
    .detail-bar {
      padding: 26px;
      border-radius: var(--radius);
      color: #fff;
      background: var(--deep);
      box-shadow: var(--shadow);
    }

    .detail-topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .detail-breadcrumb { margin: 0 0 8px; color: #b9ced3; font-size: 12px; }
    .detail-bar h2 { margin: 0; font-family: inherit; font-size: clamp(27px, 5vw, 42px); line-height: 1.18; letter-spacing: -.04em; }
    .detail-info { margin: 12px 0 0; color: #d7e2e5; font-size: 13px; }
    .detail-course-controls { display: flex; align-items: stretch; gap: 8px; flex-shrink: 0; }
    .detail-course-nav { min-width: 112px; height: 58px; margin: 0; }
    .detail-course-nav:disabled { opacity: .38; cursor: default; }
    .detail-number-form { width: 58px; height: 58px; margin: 0; }
    .detail-number,
    .detail-number-input { box-sizing: border-box; width: 58px; min-width: 58px; height: 58px; border-radius: 18px; font-family: inherit; font-size: 25px; font-weight: 900; text-align: center; }
    .detail-number { display: grid; padding: 0; border: 0; place-items: center; color: var(--deep); background: #f2d492; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease; }
    .detail-number:hover, .detail-number:focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 3px rgba(242,212,146,.28); outline: none; }
    .detail-number-input { padding: 0 5px; border: 2px solid #f2d492; color: var(--deep); background: #fff; outline: none; }
    .detail-number-input:focus { box-shadow: 0 0 0 4px rgba(242,212,146,.24); }

    .content-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
    .content-tab { padding: 12px 10px; border: 1px solid rgba(255,255,255,.22); border-radius: 12px; color: #fff; background: rgba(255,255,255,.07); font-weight: 850; cursor: pointer; }
    .content-tab.active { color: var(--deep); background: #fff; }

    .content-panel { margin-top: 20px; padding: clamp(24px, 5vw, 48px); min-height: 440px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
    .panel-label { display: inline-block; margin-bottom: 18px; padding: 5px 10px; border-radius: 999px; color: var(--clinical); background: var(--clinical-soft); font-size: 11px; font-weight: 900; }
    .content-panel h3 { margin: 0 0 10px; font-family: inherit; font-size: 28px; }
    .content-panel p { color: var(--muted); }
    .empty-state { display: grid; min-height: 270px; place-items: center; border: 1px dashed #cbdde6; border-radius: 17px; background: #f7fbfd; text-align: center; }
    .empty-state strong { display: block; color: var(--ink); font-size: 17px; }
    .empty-state span { display: block; max-width: 440px; margin-top: 7px; color: var(--muted); font-size: 13px; }

    /* Wiki-style lecture notes */
    .content-panel.notes-mode { padding: 0; overflow: hidden; }
    .wiki-note { color: #1e293b; line-height: 1.75; }
    .wiki-hero { padding: clamp(28px,5vw,52px); background: linear-gradient(135deg,#eef9ff 0%,#f8fcff 56%,#fff 100%); border-bottom: 1px solid #dcecf4; }
    .wiki-hero-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .wiki-hero-title { min-width: 0; }
    .wiki-hero-edit { flex: 0 0 auto; padding: 10px 15px; font-size: 14px; }
    .wiki-kicker { margin: 0 0 8px; color: #1683ad; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .wiki-hero h3 { margin: 0; color: #153746; font-size: clamp(30px,5vw,46px); line-height: 1.2; }
    .wiki-hero > p { max-width: 720px; margin: 14px 0 0; color: #52707d; font-size: 16px; }
    .wiki-stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .wiki-stat { padding: 9px 13px; border: 1px solid #cfe6f0; border-radius: 999px; background: rgba(255,255,255,.82); color: #24566a; font-size: 13px; font-weight: 850; }
    .wiki-layout { display: grid; grid-template-columns: 210px minmax(0,1fr); gap: 34px; padding: clamp(24px,5vw,48px); }
    .wiki-toc { align-self: start; position: sticky; top: 24px; display: grid; gap: 5px; padding: 16px; border: 1px solid #dbe8ee; border-radius: 18px; background: #f8fbfc; }
    .wiki-toc strong { margin-bottom: 6px; color: #315665; font-size: 13px; }
    .wiki-toc-link { width: 100%; padding: 8px 9px; border: 0; border-radius: 10px; background: transparent; color: #5f7883; text-align: left; font: inherit; font-size: 13px; font-weight: 750; cursor: pointer; }
    .wiki-toc-link:hover { background: #e7f5fb; color: #0b729c; }
    .wiki-article { min-width: 0; }
    .wiki-section { scroll-margin-top: 24px; padding: 0 0 38px; margin: 0 0 38px; border-bottom: 1px solid #e7eef2; }
    .wiki-section:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
    .wiki-section h4 { margin: 0 0 16px; color: #173f50; font-size: 25px; line-height: 1.35; }
    .wiki-section h5 { margin: 24px 0 9px; color: #28586b; font-size: 18px; }
    .wiki-section p { margin: 0 0 14px; color: #4d6874; }
    .wiki-section ul { margin: 10px 0 18px; padding-left: 22px; color: #415d69; }
    .wiki-section li { margin: 7px 0; }
    .wiki-term { color: #0b789f; font-weight: 900; }
    .wiki-callout { margin: 18px 0; padding: 15px 17px; border-left: 4px solid #38a9cf; border-radius: 0 14px 14px 0; background: #eef9fd; color: #315c6d; }
    .wiki-callout.exam { border-left-color: #e87972; background: #fff4f3; color: #7b3c38; }
    .wiki-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; margin: 20px 0; }
    .wiki-grid.single { grid-template-columns: minmax(0,1fr); }
    .wiki-figure { margin: 0; padding: 14px; border: 1px solid #dce8ed; border-radius: 18px; background: #fff; box-shadow: 0 8px 22px rgba(25,64,79,.06); }
    .wiki-figure img { width: 100%; max-height: 560px; display: block; object-fit: contain; border-radius: 12px; background: #fff; cursor: zoom-in; }
    .wiki-figure figcaption { margin-top: 10px; color: #6a818b; font-size: 12px; line-height: 1.55; }
    .wiki-table-wrap { overflow-x: auto; margin: 20px 0; border: 1px solid #dce8ed; border-radius: 16px; }
    .wiki-table { width: 100%; border-collapse: collapse; min-width: 620px; background: #fff; font-size: 14px; }
    .wiki-table th, .wiki-table td { padding: 13px 14px; border-bottom: 1px solid #e7eef2; text-align: left; vertical-align: top; }
    .wiki-table th { background: #edf8fc; color: #28586b; font-weight: 900; }
    .wiki-table tr:last-child td { border-bottom: 0; }
    .wiki-link { color: #087ea4; font-weight: 850; text-decoration: none; border-bottom: 1px dotted #38a9cf; }
    .wiki-link:hover, .wiki-link:focus-visible { color: #075985; border-bottom-style: solid; outline: none; }
    .wiki-link-missing { color: #b91c1c; border-bottom: 1px dotted #ef4444; cursor: help; }
    .wiki-footnote-ref { position: relative; display: inline-block; margin-left: 2px; color: #1683ad; font-size: .75em; font-weight: 900; text-decoration: none; vertical-align: super; }
    .wiki-footnote-ref::before,
    .wiki-footnote-ref::after { position: absolute; left: 50%; z-index: 1200; pointer-events: none; opacity: 0; transition: opacity .15s ease, transform .15s ease; }
    .wiki-footnote-ref::before { content: ""; bottom: calc(100% + 4px); border: 6px solid transparent; border-top-color: #18323d; transform: translate(-50%, 3px); }
    .wiki-footnote-ref::after { content: attr(data-wiki-footnote-preview); bottom: calc(100% + 16px); width: max-content; min-width: 150px; max-width: min(340px, calc(100vw - 32px)); padding: 10px 12px; border-radius: 10px; color: #fff; background: #18323d; box-shadow: 0 10px 28px rgba(15,23,42,.22); font-size: 13px; font-weight: 650; line-height: 1.55; text-align: left; white-space: normal; vertical-align: baseline; transform: translate(-50%, 5px); }
    .wiki-footnote-ref:hover::before, .wiki-footnote-ref:hover::after,
    .wiki-footnote-ref:focus-visible::before, .wiki-footnote-ref:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
    .wiki-footnotes { margin-top: 38px; padding-top: 22px; border-top: 2px solid #dce8ed; }
    .wiki-footnotes h4 { margin: 0 0 12px; color: #315665; font-size: 18px; }
    .wiki-footnotes ol { margin: 0; padding-left: 26px; color: #526c77; }
    .wiki-footnotes li { margin: 8px 0; padding: 5px 8px; border-radius: 8px; scroll-margin-top: 24px; cursor: pointer; transition: background .18s ease, box-shadow .18s ease; }
    .wiki-footnotes li:hover, .wiki-footnotes li:focus-visible { background: #eef8fb; box-shadow: 0 0 0 2px rgba(22,131,173,.18); outline: none; }
    .wiki-footnote-backs { display: inline-flex; flex-wrap: wrap; gap: 5px; margin-left: 7px; }
    .wiki-footnote-back { color: #1683ad; font-weight: 800; text-decoration: none; }
    .wiki-footnote-back:hover { text-decoration: underline; }
    .wiki-footnote-flash { animation: wiki-footnote-flash 1.15s ease; }
    @keyframes wiki-footnote-flash { 0%, 42% { background: #fff2a8; box-shadow: 0 0 0 4px rgba(244,190,54,.24); } 100% { background: transparent; box-shadow: none; } }
    .wiki-source-page { color: #6a818b; font-size: 12px; }
    .wiki-editor-shell { padding: clamp(18px,4vw,34px); background: #f8fbfc; }
    .wiki-editor-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    .wiki-editor-head h3 { margin: 0; color: #153746; font-size: 24px; }
    .wiki-editor-head p { margin: 5px 0 0; color: #627985; font-size: 13px; }
    .wiki-source-editor { width: 100%; min-height: 680px; padding: 18px; border: 1px solid #bad8e5; border-radius: 16px; background: #fff; color: #17212b; font: 15px/1.7 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; resize: vertical; outline: none; tab-size: 2; }
    .wiki-source-editor:focus { border-color: #38a9cf; box-shadow: 0 0 0 4px rgba(56,169,207,.13); }
    .wiki-editor-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 14px; flex-wrap: wrap; }
    .wiki-syntax-help { margin-top: 18px; border: 1px solid #d8e7ed; border-radius: 16px; background: #fff; overflow: hidden; }
    .wiki-syntax-help summary { padding: 13px 15px; color: #315665; font-weight: 900; cursor: pointer; }
    .wiki-syntax-grid { display: grid; grid-template-columns: minmax(160px,.7fr) minmax(260px,1.3fr); border-top: 1px solid #e3edf1; }
    .wiki-syntax-grid code, .wiki-syntax-grid span { padding: 10px 13px; border-bottom: 1px solid #edf3f5; }
    .wiki-syntax-grid code { color: #075985; background: #f4fafc; overflow-wrap: anywhere; }
    .wiki-syntax-grid span { color: #526c77; }
    .wiki-render-warning { margin: 18px 0; padding: 14px 16px; border-left: 4px solid #e87972; border-radius: 0 14px 14px 0; background: #fff4f3; color: #7b3c38; }

    /* JBL question viewer — copied from question_viewer_updated.html */
    body.jbl-mode { background: #f1f5f9; color: #0f172a; }
    body.jbl-mode .masthead { display: none; }
    body.jbl-mode main { width: 100%; max-width: none; padding: 0; }
    .nav-button.jbl-launch { color: #fff; background: #0f172a; border-color: #0f172a; font-weight: 900; }
    .content-panel.j-mode { padding: 0; border: 0; background: transparent; box-shadow: none; }

    .jbl-standalone,
    .jbl-embed {
      color: #0f172a;

  <script>
    const courseSeed = [

        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    };

            <section id="note-01-wall" class="wiki-section">
              <h4>2. 대장벽의 기본 조직</h4>
              <p>대장벽도 소화관의 기본 4층 구조인 <strong>점막, 점막밑층, 근육층, 장막 또는 바깥막</strong>으로 구성된다. 소장과 구별되는 핵심은 점막과 바깥세로근층의 형태이다.</p>
              <h5>점막</h5><ul><li><strong>윤상주름과 융모가 없다.</strong> 표면은 비교적 평평하고 장샘 입구가 pit처럼 보인다.</li><li><strong>장샘은 길고 곧은 단순관상샘</strong>이며 점막근판까지 수직으로 내려간다.</li><li>주요 세포는 흡수세포와 술잔세포이며, 장내분비세포는 소수이다.</li><li>고유판과 점막밑층에는 <strong>MALT/GALT에 해당하는 림프소절</strong>이 풍부할 수 있다.</li></ul>
              <h5>근육층</h5><p>속돌림근층은 기본적으로 연속되어 있지만, 맹장과 결장에서는 바깥세로근층이 변형되어 세 개의 결장띠를 형성한다.</p>
              <div class="wiki-grid"><figure class="wiki-figure"><img data-note-image src="./assets/lecture-01/fig-03-colon-surface.jpg" alt="융모 없이 샘 입구가 보이는 대장 점막 표면" /><figcaption>융모 없이 장샘 입구가 pit처럼 보이는 대장 표면. 원본 강의록 p.2.</figcaption></figure><figure class="wiki-figure"><img data-note-image src="./assets/lecture-01/fig-02-colon-mucosa.jpg" alt="곧은 단순관상샘과 술잔세포가 보이는 대장 점막" /><figcaption>곧고 긴 장샘과 풍부한 술잔세포가 보이는 대장 점막. 원본 강의록 p.2.</figcaption></figure></div>
              <div class="wiki-callout exam"><strong>소장과의 감별</strong> · 대장은 plicae와 villi가 없고, 길고 곧은 crypt와 풍부한 goblet cell이 두드러진다.</div>
            </section>

            <section id="note-01-colon" class="wiki-section">
              <h4>3. 맹장과 결장의 특수구조</h4>
              <div class="wiki-grid"><div><h5>결장띠 · Teniae coli</h5><p>바깥세로근층이 세 개의 세로 방향 근육다발로 응축된 구조이다. 결장 벽을 부분적으로 짧게 당겨 팽대를 만드는 기반이 된다.</p><h5>잘록창자팽대 · Haustra coli</h5><p>결장띠에 의해 결장벽이 주머니처럼 볼록해진 구획이다.</p><h5>복막주렁 · Appendices epiploicae</h5><p>장막 표면의 지방조직이 자루처럼 돌출된 구조로, omental appendages라고도 한다.</p></div><figure class="wiki-figure"><img data-note-image src="./assets/lecture-01/fig-04-colon-modifications.jpg" alt="결장띠, 잘록창자팽대, 복막주렁이 표시된 결장 표본" /><figcaption>TC: 결장띠, HC: 잘록창자팽대, OA: 복막주렁. 원본 강의록 p.3.</figcaption></figure></div>
              <div class="wiki-callout"><strong>연결해서 기억하기</strong> · 바깥세로근층의 응축 &rarr; 세 개의 결장띠 &rarr; 벽의 단축과 팽대 형성.</div>
            </section>

            <section id="note-01-appendix" class="wiki-section">
              <h4>4. 충수</h4>
              <div class="wiki-grid"><div><ul><li>폭 약 <strong>8 mm</strong>, 길이 약 <strong>10-15 cm</strong>이다.</li><li>곧은 단순관상 장샘을 가지며 융모는 없다.</li><li>술잔세포와 Paneth cell은 소수이고, 장내분비세포가 많이 관찰된다.</li><li>고유판과 점막밑층에 <strong>림프소절이 매우 풍부</strong>하다.</li><li>림프소절이 점막근판의 연속성을 끊어 불완전하게 보이게 할 수 있다.</li><li>강의자료에서는 바깥세로근층과 결장띠의 연속 관계도 함께 강조한다.</li></ul></div><figure class="wiki-figure"><img data-note-image src="./assets/lecture-01/fig-05-appendix-cross-section.jpg" alt="림프소절이 풍부한 충수 횡단면 조직 사진" /><figcaption>점막과 점막밑층에 림프소절이 풍부한 충수 횡단면. 원본 강의록 p.4.</figcaption></figure></div>

            <section id="note-01-anorectal" class="wiki-section">
              <h4>5. 직장과 항문관</h4>
              <h5>직장</h5><ul><li>가로 방향의 직장주름을 가진다.</li><li>상피는 단층원주상피이며 술잔세포가 풍부하다.</li></ul>
              <h5>항문관</h5><p>항문관은 약 <strong>4 cm</strong> 길이이다. 8-10개의 세로 방향 항문기둥은 점막과 점막밑층이 함께 돌출되어 형성되고, 아래쪽의 항문판막과 연결된다.</p>
              <div class="wiki-grid"><figure class="wiki-figure"><img data-note-image src="./assets/lecture-01/fig-06-anal-canal-anatomy.jpg" alt="직장, 항문기둥, 항문판막과 항문조임근의 해부 그림" /><figcaption>항문기둥, 항문정맥얼기, 속·바깥항문조임근의 위치. 원본 강의록 p.5.</figcaption></figure><figure class="wiki-figure"><img data-note-image src="./assets/lecture-01/fig-07-anal-canal-histology.jpg" alt="직장항문 경계에서 상피와 근육 구조가 변하는 조직 사진" /><figcaption>직장항문 경계의 조직 변화. CRZ, ATZ, SQZ가 연속해서 보인다. 원본 강의록 p.5.</figcaption></figure></div>
              <h5>혈관</h5><p>고유판과 점막밑층에는 <strong>내치핵정맥얼기</strong>가 풍부하며, 동정맥문합 때문에 혈관이 굵고 구불구불하게 보일 수 있다. 강의 필기에서는 이 부위 질환에서 출혈량이 많아질 수 있음을 연결해 설명한다. <em>Corpus cavernosum recti</em>도 함께 기억한다.</p>
              <h5>근육</h5><ul><li><span class="wiki-term">속항문조임근</span>: 속돌림근층이 두꺼워진 평활근, 불수의근.</li><li><span class="wiki-term">바깥항문조임근</span>: 골격근, 수의근.</li></ul>
              <h5>상피 이행</h5><p>직장의 단층원주상피는 직장항문경계에서 <strong>비각질중층편평상피</strong>로 급격히 바뀐다. 피부부위로 내려가면 색소침착, 항문주위 아포크린땀샘, 털과 피지샘 등 피부의 특징이 나타난다.</p>
            </section>

              <div class="wiki-table-wrap"><table class="wiki-table"><thead><tr><th>부위</th><th>점막·상피</th><th>샘·세포</th><th>대표 감별점</th></tr></thead><tbody><tr><td>맹장·결장</td><td>융모 없음, 단층원주상피</td><td>곧은 단순관상샘, 술잔세포 풍부</td><td>결장띠, 팽대, 복막주렁</td></tr><tr><td>충수</td><td>불규칙한 내강, 점막근판이 불완전하게 보일 수 있음</td><td>림프소절 풍부, 소수의 술잔세포·Paneth cell</td><td>벽 전반의 풍부한 림프조직</td></tr><tr><td>직장</td><td>단층원주상피, 술잔세포 풍부</td><td>곧은 장샘</td><td>가로직장주름</td></tr><tr><td>항문관</td><td>단층원주 &rarr; 비각질중층편평 &rarr; 피부</td><td>말단에서 땀샘·피지샘 등장</td><td>항문기둥, 정맥얼기, 두 조임근</td></tr></tbody></table></div>
